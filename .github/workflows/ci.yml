name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
        env:
          BETTER_AUTH_SECRET: ci-secret-min-32-chars-long!!!!!!
          BETTER_AUTH_URL: http://localhost:3000
          MONGO_CONNECTION_STRING: mongodb://localhost:27017/scaffolding-test
          NEXT_PUBLIC_POSTHOG_HOST: ''
